name: agent-leak

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    platform: linux/amd64
    init: true
    restart: "no"
    mem_limit: 1g
    cpus: 1.0
    environment:
      AGENT_HOME: /home/agent/app
      AGENT_PORT: "15034"
      AGENT_UPLOAD_DIR: /home/agent/app/upload_files
      AGENT_KEY_PATH: /home/agent/app/api_keys
      AGENT_LOG_DIR: /home/agent/app/logs
      MEMORY_LIMIT: "128"
      CPU_MAX_OCCUPY: "50"
      MULTI_THREAD_ENABLE: "true"
    ports:
      - "127.0.0.1:15034:15034"
    volumes:
      - agent-logs:/home/agent/app/logs
      - agent-uploads:/home/agent/app/upload_files

volumes:
  agent-logs:
  agent-uploads:
